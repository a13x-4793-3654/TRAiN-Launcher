[package]
name = "train-launcher-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TRAiN Launcher desktop application (Tauri shell)"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "train_launcher_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "fs"] }

train-launcher-core = { path = "../../crates/core" }
train-launcher-auth = { path = "../../crates/auth" }
train-launcher-mods = { path = "../../crates/mods" }
train-launcher-server-api = { path = "../../crates/train-api" }
tauri-plugin-dialog = "2.7.3"
# ランチャー自体のセルフアップデート機能(GitHub Releasesの`latest.json`を参照)。
tauri-plugin-updater = "2"
# アップデート適用後、アプリを再起動するために使用。
tauri-plugin-process = "2"

[dev-dependencies]
# 共有 `.minecraft` フォルダの管理ファイル整理ロジック(`prune_stale_managed_files`)の
# テストで、実ファイルシステム上に隔離した一時ディレクトリを作るために使用。
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
