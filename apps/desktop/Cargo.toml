[package]
name = "train-launcher-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TRAiN Launcher desktop application (Tauri shell)"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "train_launcher_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

train-launcher-core = { path = "../../crates/core" }
train-launcher-auth = { path = "../../crates/auth" }
train-launcher-mods = { path = "../../crates/mods" }
train-launcher-server-api = { path = "../../crates/train-api" }
