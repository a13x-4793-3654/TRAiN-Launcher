[package]
name = "train-launcher-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TRAiN Launcher: MSA / XboxLive / Minecraft authentication chain and Discord OAuth2 sign-in"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1"
oauth2 = "5"
minecraft-msa-auth = "0.5"
