[package]
name = "train-launcher-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TRAiN Launcher: profile management, Minecraft version manifest/library/asset download, and launch command construction"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1"
