[package]
name = "train-launcher-mods"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TRAiN Launcher: Modrinth/CurseForge mod resolution, dependency resolution, and resource pack installation"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1"
ferinth = "2"
furse = "1"
