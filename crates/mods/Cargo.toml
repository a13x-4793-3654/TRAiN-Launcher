[package]
name = "train-launcher-mods"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TRAiN Launcher: Modrinth/CurseForge mod resolution, dependency resolution, and resource pack installation"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1"
ferinth = "2"
furse = "1"
# Modrinth/CurseForgeのURL解析、およびCurseForgeのスラッグ検索API(`furse`未対応)の
# 直接呼び出しに使用。
url = "2"
# ダウンロードしたファイルの整合性検証(SHA1)に使用。
sha1 = "0.10"
