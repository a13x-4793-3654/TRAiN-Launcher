[package]
name = "train-launcher-server-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TRAiN Launcher: client for TRAiN's own backend API (member server discovery/config). API spec is not yet finalized; trait + mock implementation only."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1"
async-trait = "0.1"
